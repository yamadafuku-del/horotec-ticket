<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>整理券予約・確認</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background-color: #f4f6f8; color: #333; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
    .ticket-label { font-size: 14px; color: #666; font-weight: bold; }
    /* 巨大整理券番号 */
    .ticket-number { font-size: 56px; font-weight: 900; color: #00B900; margin: 10px 0; letter-spacing: 2px; }
    .ticket-info { font-size: 16px; color: #444; margin-bottom: 8px; }
    .status-badge { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-top: 6px; }
    .test-banner { background-color: #fff3cd; color: #856404; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; border: 1px solid #ffeeba; }
    
    label { font-weight: bold; display: block; margin-top: 12px; text-align: left; }
    select, textarea, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
    button { background-color: #00B900; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 16px; }
    button.cancel-btn { background-color: #d32f2f; margin-top: 8px; }
    button:disabled { background-color: #ccc; }
    .inquiry-box { margin-top: 24px; text-align: left; }
    .loading { text-align: center; font-size: 16px; color: #666; padding: 40px 0; }
  </style>
</head>
<body>

  <!-- テストモード表示バナー -->
  <div id="test-banner" class="test-banner" style="display: none;">
    ⚠️ 現在ブラウザ直接閲覧モード（テスト環境）で表示中
  </div>

  <div id="loading" class="loading">読み込み中...</div>

  <div id="main-content" style="display: none;">
    
    <!-- 整理券（所有時のみ大きく表示） -->
    <div id="ticket-card" class="card" style="display: none;">
      <div class="ticket-label">あなたの整理券番号</div>
      <div id="disp-ticket-no" class="ticket-number">---</div>
      <div class="ticket-info">予約人数: <strong id="disp-party-size">-</strong> 名様</div>
      <div class="ticket-info">時間枠: <strong id="disp-slot-code">-</strong></div>
      <div class="status-badge">【受付中】時間になりましたらお越しください</div>
    </div>

    <!-- 予約 / 人数変更 フォーム -->
    <div class="card" style="text-align: left;">
      <h3 id="form-title" style="margin-top:0;">整理券を取得する</h3>
      
      <label for="slot-select">時間枠（空き状況）</label>
      <select id="slot-select"></select>

      <label for="party-select">人数（1〜6名）</label>
      <select id="party-select">
        <option value="1">1名</option>
        <option value="2">2名</option>
        <option value="3">3名</option>
        <option value="4">4名</option>
        <option value="5">5名</option>
        <option value="6">6名</option>
      </select>

      <button id="book-btn" onclick="handleBook()">整理券を発行する</button>
      <button id="cancel-btn" class="cancel-btn" onclick="handleCancel()" style="display: none;">全キャンセル</button>
    </div>

    <!-- 問い合わせフォーム -->
    <div class="card inquiry-box">
      <h3 style="margin-top:0;">お問い合わせ</h3>
      <textarea id="inquiry-text" rows="3" placeholder="ご質問・メッセージを入力してください"></textarea>
      <button onclick="handleInquiry()" style="background-color: #1976d2;">送信する</button>
    </div>

  </div>

  <script>
    let currentUserId = 'TEST_USER_999';
    let currentTicketNo = '';
    let isTestMode = false;

    // ダミーデータ（ブラウザテスト用）
    const dummySlots = [
      { code: 'A', label: '10:00〜10:30', capacity: 15, remaining: 8 },
      { code: 'B', label: '10:30〜11:00', capacity: 15, remaining: 15 },
      { code: 'C', label: '11:00〜11:30', capacity: 15, remaining: 0 }
    ];
    let dummyReservation = null;

    window.onload = function () {
      // LIFF IDが設定されているかチェック
      const LIFF_ID = "YOUR_LIFF_ID"; // ※実際のLIFF IDを入れてください

      if (typeof liff !== 'undefined' && LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID") {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(profile => {
                currentUserId = profile.userId;
                refreshData();
              });
            } else {
              // ブラウザテスト時
              enableTestMode();
            }
          })
          .catch(err => {
            console.warn("LIFF 初期化スキップ (テストモード移行):", err);
            enableTestMode();
          });
      } else {
        enableTestMode();
      }
    };

    function enableTestMode() {
      isTestMode = true;
      document.getElementById('test-banner').style.display = 'block';
      refreshData();
    }

    function refreshData() {
      if (isTestMode || typeof google === 'undefined' || !google.script) {
        // テスト表示用データレンダリング
        renderSlots(dummySlots);
        renderReservation(dummyReservation);
        showMainContent();
      } else {
        // GAS本番連携
        google.script.run.withSuccessHandler(slots => {
          renderSlots(slots);
          google.script.run.withSuccessHandler(res => {
            renderReservation(res);
            showMainContent();
          }).getUserReservation(currentUserId);
        }).getSlotAvailability();
      }
    }

    function showMainContent() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
    }

    function renderSlots(slots) {
      const select = document.getElementById('slot-select');
      select.innerHTML = '';
      slots.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.code;
        opt.textContent = `${s.label} (残り ${s.remaining}名)`;
        if (s.remaining <= 0) opt.disabled = true;
        select.appendChild(opt);
      });
    }

    function renderReservation(res) {
      if (res) {
        currentTicketNo = res.ticketNo;
        document.getElementById('ticket-card').style.display = 'block';
        document.getElementById('disp-ticket-no').textContent = res.ticketNo;
        document.getElementById('disp-party-size').textContent = res.partySize;
        document.getElementById('disp-slot-code').textContent = res.slotCode + '枠';
        
        document.getElementById('form-title').textContent = '予約内容の変更';
        document.getElementById('book-btn').textContent = '人数・時間を変更する';
        document.getElementById('cancel-btn').style.display = 'block';
        document.getElementById('slot-select').value = res.slotCode;
        document.getElementById('party-select').value = res.partySize;
      } else {
        currentTicketNo = '';
        document.getElementById('ticket-card').style.display = 'none';
        document.getElementById('form-title').textContent = '整理券を取得する';
        document.getElementById('book-btn').textContent = '整理券を発行する';
        document.getElementById('cancel-btn').style.display = 'none';
      }
    }

    function handleBook() {
      const slot = document.getElementById('slot-select').value;
      const party = document.getElementById('party-select').value;
      
      if (isTestMode || typeof google === 'undefined' || !google.script) {
        dummyReservation = {
          ticketNo: `${slot}-1`,
          partySize: party,
          slotCode: slot
        };
        alert(`【テスト表示】整理券 ${slot}-1（${party}名）を発行しました。`);
        refreshData();
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('main-content').style.display = 'none';

      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          refreshData();
        })
        .withFailureHandler(err => {
          alert(err.message);
          refreshData();
        })
        .bookOrUpdateTicket(currentUserId, slot, party);
    }

    function handleCancel() {
      if (!confirm('本当に予約を全キャンセルしますか？')) return;

      if (isTestMode || typeof google === 'undefined' || !google.script) {
        dummyReservation = null;
        alert('【テスト表示】予約をキャンセルしました。');
        refreshData();
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('main-content').style.display = 'none';

      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          refreshData();
        })
        .withFailureHandler(err => {
          alert(err.message);
          refreshData();
        })
        .cancelReservation(currentUserId);
    }

    function handleInquiry() {
      const text = document.getElementById('inquiry-text').value;
      if (!text.trim()) return alert('メッセージを入力してください。');

      if (isTestMode || typeof google === 'undefined' || !google.script) {
        alert('【テスト表示】問い合わせを送信しました。');
        document.getElementById('inquiry-text').value = '';
        return;
      }

      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          document.getElementById('inquiry-text').value = '';
        })
        .withFailureHandler(err => alert(err.message))
        .sendInquiry(currentUserId, currentTicketNo, text);
    }
  </script>
</body>
</html>
